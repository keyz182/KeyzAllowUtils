name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  restore:
    name: Restore NuGet packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.6/Source

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore KeyzAllowUtilities.Tests/KeyzAllowUtilities.Tests.csproj

      # Build and test require RimWorld game DLLs (Assembly-CSharp.dll, UnityEngine.CoreModule.dll)
      # which cannot be distributed. Run tests locally:
      #   dotnet test KeyzAllowUtilities.Tests/KeyzAllowUtilities.Tests.csproj --framework net8.0