name: publish

on:
    push:
        tags:
        - v20*

env:
    DOTNET_VERSION: '8.0.123' # The .NET SDK version to use

permissions:
    packages: write
    contents: write

jobs:
    publish:

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
            - name: Setup .NET Core
              uses: actions/setup-dotnet@v3
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Build
              run: |
                  ./release.sh

            - name: Release
              uses: softprops/action-gh-release@v2
              if: github.ref_type == 'tag'
              with:
                  name: Release - ${{ github.ref }}
                  files: KeyzAllowUtils.zip
