name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@c7a74f5406bab86da17da0f0e460a69f8219a68c  # v3
        with:
          check: false
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"

      # Build runs before the version bump so a broken build never creates a
      # tag. The pre_bump_hooks in cog.toml rebuild with the stamped version.
      - name: Build (pre-flight)
        run: dotnet build 1.6/Source/KeyzAllowUtilities/KeyzAllowUtilities.csproj -c Release

      - name: Bump version and update changelog
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git tag --list)" ]; then
            git tag v1.0.0
            cog changelog > CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs: add changelog"
            git push origin main
            git push origin refs/tags/v1.0.0
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE=$(git describe --tags --abbrev=0)
            if cog bump --auto; then
              AFTER=$(git describe --tags --abbrev=0)
              if [ "$BEFORE" = "$AFTER" ]; then
                echo "No version change ($BEFORE) — skipping release"
                echo "bumped=false" >> "$GITHUB_OUTPUT"
              else
                cog changelog > CHANGELOG.md
                git add CHANGELOG.md
                git commit -m "docs: update changelog for ${AFTER}"
                git push origin main
                git push origin "refs/tags/${AFTER}"
                echo "version=$AFTER" >> "$GITHUB_OUTPUT"
                echo "bumped=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "bumped=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Package mod
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/KeyzAllowUtils
          cp -r About dist/KeyzAllowUtils/
          cp -r Common dist/KeyzAllowUtils/
          cp -r Compatibility dist/KeyzAllowUtils/
          cp -r 1.6 dist/KeyzAllowUtils/
          rm -rf dist/KeyzAllowUtils/1.6/Source
          cp loadFolders.xml LICENSE dist/KeyzAllowUtils/
          cd dist
          zip -r "../KeyzAllowUtils-${VERSION}.zip" KeyzAllowUtils/

      - name: Generate release notes
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cog changelog --at "$VERSION" > release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --title "KeyzAllowUtils $VERSION" \
            --notes-file release-notes.md \
            "KeyzAllowUtils-${VERSION}.zip#KeyzAllowUtils Mod Package"
